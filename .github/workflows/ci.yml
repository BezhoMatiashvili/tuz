name: Security and test gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-and-security:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_DB: warehouse_security
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d warehouse_security"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      WAREHOUSE_TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/warehouse_security
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # gitleaks scans the pushed commits (first^..last): a shallow clone cannot resolve
          # that range, and with one commit it scans the whole tree as one diff.
          fetch-depth: 0
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: uv sync --extra dev --locked
      - run: uv run ruff check .
      - run: uv run python -m unittest discover -s tests -v
      # The dashboard's and the website widget's own tests (plain Node, no browser).
      - run: for test in tests/*_test.mjs; do node "$test"; done
      - run: uv run bandit -q -r warehouse_sync automotive
      - run: uv run pip-audit
      - run: uv run cyclonedx-py environment --output-file warehouse-sync.sbom.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: warehouse-sync-sbom
          path: warehouse-sync.sbom.json
          retention-days: 90

  codeql:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: github/codeql-action/init@b7b84b636b4f90c9b31da1bc5f72bfadd5b31410 # v3
        with:
          languages: python
          build-mode: none
      # Code scanning is not available for this private repository on the Free plan, so the
      # results are not uploaded there (that call failed every run): the analysis still runs,
      # and its SARIF is kept as an artifact to read or open in an editor.
      - uses: github/codeql-action/analyze@b7b84b636b4f90c9b31da1bc5f72bfadd5b31410 # v3
        with:
          upload: never
          output: codeql-results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: codeql-sarif
          path: codeql-results
          retention-days: 30
