# Installed by ops/digitalocean/server/bootstrap as /etc/nginx/conf.d/tuz.conf until HTTPS
# is switched on (tuz-enable-https). It only answers Let's Encrypt's ownership check; the
# site itself is not reachable from the internet yet.
server_tokens off;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 444;
    }
}
