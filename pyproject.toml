[project]
name = "warehouse-sync"
version = "0.1.0"
description = "Read-only warehouse catalogue synchronizer for PostgreSQL"
requires-python = ">=3.11"
dependencies = [
    "anthropic==0.72.0",
    "fastapi==0.155.0",
    "httpx==0.28.1",
    "uvicorn==0.54.0",

    "psycopg[binary]==3.3.2",
    "python-dotenv==1.2.1",
    "requests==2.32.5",
]

[project.optional-dependencies]
dev = [
    "bandit==1.8.3",
    "cyclonedx-bom==4.6.0",
    "pip-audit==2.9.0",
    "pytest==8.3.5",
    "pytest-cov==6.0.0",
    "ruff==0.9.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a disposable PostgreSQL instance",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
